name: CI/CD Pipeline y Despliegue en GitHub Pages

# Eventos que disparan el flujo de trabajo
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Ejecución programada diariamente a las 08:00 UTC para actualizar precios
    - cron: "0 8 * * *"
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

# Permisos requeridos por GitHub Pages para el despliegue seguro
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos que puedan generar conflictos
concurrency:
  group: "pages"
  cancel-in-progress: false

# Variables de entorno globales del pipeline
env:
  PYTHON_VERSION: "3.11"
  TARGET_URL: "https://books.toscrape.com/"
  MAX_ITEMS: "20"

jobs:
  # ============================================================
  # JOB 1: INTEGRACIÓN CONTINUA (CI) - Pruebas y Construcción
  # ============================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 3. Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar pruebas unitarias automatizadas (CI)
        run: |
          pytest -v tests/test_app.py

      - name: 5. Ejecutar Scraper y construir aplicación web estática
        run: |
          python build_web.py

      - name: 6. Guardar dataset CSV como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: dataset-libros-ea3
          path: |
            libros.csv
            libros.json

      - name: 7. Empaquetar sitio web para GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # ============================================================
  # JOB 2: DESPLIEGUE CONTINUO (CD) - Publicación en la Nube
  # ============================================================
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar aplicación web en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
